[plugin]
slug        = "torrents"
name        = "Torrents"
version     = "0.3.0"
rpp_version = "1"
license     = "MIT"

[capabilities]
torrent = "rom_hub_torrents.torrent:Torrents"

[permissions]
# Two different kinds of host, both declared here because the host checks both
# against this one list.
#
#   archive.org        fetched by the Hub -- item metadata, the .torrent, and
#                      the https web seeds a single-file fetch reads from.
#                      `*.archive.org` also covers bt1/bt2.archive.org, whose
#                      trackers every Archive.org torrent announces to.
#
#   the rest           announced to by YOUR torrent client, never fetched by
#                      the Hub. They are open public trackers, declared so a
#                      magnet can carry trackers at all: the host gates every
#                      `tr=` by hostname against this list, so an undeclared
#                      tracker is dropped and the magnet falls back to DHT --
#                      which is the slow path this list exists to avoid.
#
# Read this list before installing. It is the complete set of hosts this
# plugin can cause traffic to.
network = [
  "archive.org",
  "*.archive.org",

  # Flashpoint Archive publishes its own torrents here -- 220,567 preserved
  # web games and animations. Declared so the .torrent itself can be fetched
  # and read; the payload is moved by your torrent client, not by the Hub.
  "download.unstable.life",
  "unstable.life",
  "*.unstable.life",

  "tracker.opentrackr.org",
  "tracker.opentrackr.com",
  "open.demonii.com",
  "open.tracker.cl",
  "tracker.publictracker.xyz",
  "tracker.wildkat.net",
  "tracker.qu.ax",
  "tracker.peerfect.org",
  "tracker.ilibr.org",
  "tracker.filemail.com",
  "tracker.ducks.party",
  "tracker.dler.org",
  "tracker.corpscorp.online",
  "tracker.bittor.pw",
  "tracker.auctor.tv",
  "tracker.0x7c0.com",
  "tracker-udp.gbitt.info",
  "torrentclub.online",
  "t.overflow.biz",
]
romm_api = []

[config]
# Append the declared public trackers to every magnet this plugin returns.
# On by default, and it is the difference between a torrent that starts and one
# that sits waiting: a magnet with no `tr=` has only DHT to find peers on, which
# is slow to bootstrap and blocked outright on some networks.
add_trackers = { type = "bool", default = true }

# Keep the trackers a magnet already carried, as well. Only those whose host is
# in the allowlist above survive the host's check; the rest are dropped and
# counted. Off by default because an indexer's magnet names private trackers
# that would announce your client somewhere you did not choose.
keep_trackers = { type = "bool", default = false }

# Which Archive.org files to name as wanted. "payload" selects the item's own
# originals and leaves the Archive's derivatives -- thumbnails, the metadata
# XML, the sqlite index -- out of the selection. "all" names nothing, which
# means the whole torrent.
archive_files = { type = "str", default = "payload" }
